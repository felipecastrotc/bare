[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "bare"
description = "BARE: Backup And Replication with Encryption"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Felipe C. T. Carvalho", email = "bare@felipecastrotc.com" }]
# Version comes from Git tags via hatch-vcs (PEP 440). Tag e.g. `v0.1.3`.
dynamic = ["version"]
dependencies = ["pyyaml>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["ruff>=0.12.10,<0.13", "pre-commit>=4.3.0,<5"]

[project.urls]
Homepage = "https://github.com/felipecastrotc/bare"
Repository = "https://github.com/felipecastrotc/bare"

[project.scripts]
bare = "src.bare.main:main"
bare_runner = "src.bare.scripts.schedule_runner:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
# Include only needed files in sdist/wheel
include = [
  "src/bare/**",
  "README.md",
  "LICENSE",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["build", "dist", ".venv", ".pixi"]
src = ["src"]

[tool.ruff.lint]
# Enable style, bug detection, formatting and import sorting
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
#   'D',    # pydocstyle
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "C4",   # flake8-comprehensions
  'PIE',  # flake8-pie
  'T20',  # flake8-print
]
pydocstyle = { convention = "google" }
mccabe = { max-complexity = 10 }
ignore = [
  "E501",  # Line too long
]

# Configure isort-style import sorting
[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
known-first-party = ["bare"]

# Optional: naming conventions
[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod"]
staticmethod-decorators = ["staticmethod"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "B"]

[tool.ruff.format]
# Enable Ruff’s formatter (Black-compatible)
quote-style = "double"
indent-style = "space"
line-ending = "lf"


[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
bare = { path = ".", editable = true, extras = ["dev"] }

[tool.pixi.tasks]
# Primary operation
backup = "bare backup"

# pre-commit settings
# Setup precommit
install-precommit = "pre-commit install && pre-commit autoupdate || true"
# Run hooks against the entire tree
precommit-run = "pre-commit run --all-files"
# Update hooked tool versions to their latest tags, then run once over the tree
precommit-update = "pre-commit autoupdate && pre-commit run --all-files"
# Remove the Git hook
precommit-uninstall = "pre-commit uninstall"

# Scripted installers (kept in-repo)
install-launchd = "bash scripts/install_launchd.sh"
uninstall-launchd = "bash scripts/uninstall_launchd.sh"
install-systemd = "bash scripts/install_systemd.sh"
uninstall-systemd = "bash scripts/uninstall_systemd.sh"

[tool.pixi.dependencies]
yaml = "*"
